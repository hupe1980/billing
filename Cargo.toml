[package]
name        = "billing"
version     = "0.16.0"
edition     = "2024"
rust-version = "1.85"
authors     = ["hupe1980"]
description = """\
EN 16931 invoice arithmetic. Fixed-point money, sign-symmetric rounding, exact \
largest-remainder splits, tariffs, VAT derived by grouping, and documents whose \
totals are derived once from their inputs. no_std. Zero I/O.\
"""
keywords    = ["billing", "invoice", "pricing", "metering", "en16931"]
categories  = ["finance", "mathematics", "no-std"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/hupe1980/billing"
homepage    = "https://hupe1980.github.io/billing"
documentation = "https://docs.rs/billing"
readme      = "README.md"
# Allowlist for the published package: source, the targets `cargo package` verifies,
# licences and docs. Repository tooling (fuzz/, scripts/, site/, CI config) stays out.
include     = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/tests/*.proptest-regressions",
    "/examples/*.rs",
    "/benches/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

# Show the serde-gated items on docs.rs. `--cfg docsrs` is reserved for future
# `doc_cfg` feature badges; the crate does not use it yet.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
## Serialize / Deserialize on every public data type. Decimals are strings in the
## `Amount::parse` grammar, never floats; `rust_decimal/serde` covers the re-exported `Decimal`.
serde = ["dep:serde", "rust_decimal/serde"]

[dependencies]
# No default features: keeps the crate `no_std` (the defaults pull in `std` and `serde`).
rust_decimal = { version = "1.43", default-features = false }
serde        = { version = "1.0.166", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
# 0.7, not 0.8: criterion 0.8 needs rustc 1.86, above this crate's MSRV (1.85).
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
# `dec!` via rust_decimal's `macros` feature, so the macro version always matches. Dev-only.
rust_decimal = { version = "1.43", default-features = false, features = ["macros"] }
serde_json   = "1.0.100"

[[bench]]
name    = "billing"
harness = false

# Profile for `cargo mutants` (.cargo/mutants.toml): ~1000 builds that never read
# debuginfo or hit the incremental cache, so both are off. Catches the same mutants.
[profile.mutants]
inherits = "dev"
debug = false
incremental = false
