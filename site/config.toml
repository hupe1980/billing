# Zola config for the landing page and docs, deployed by .github/workflows/site.yml.
# `base_url` must match the deployment origin (canonical links, Open Graph, sitemap).
base_url = "https://hupe1980.github.io/billing"

title = "billing — EN 16931 invoice arithmetic for Rust"
description = """\
EN 16931 invoice arithmetic for Rust: fixed-point money, sign-symmetric rounding, \
exact largest-remainder splits, tariffs, VAT derived by grouping, and documents whose \
totals are derived once from their inputs.\
"""
author = "hupe1980"

default_language = "en"

compile_sass = true
minify_html = true
build_search_index = true
generate_feeds = false

hard_link_static = false

[markdown]
render_emoji = false
smart_punctuation = true
insert_anchor_links = "left"

# CSS classes, not inline colours, so one HTML serves both light and dark themes.
[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[search]
index_format = "elasticlunr_json"

[extra]
repo = "https://github.com/hupe1980/billing"
crate = "https://crates.io/crates/billing"
api_docs = "https://docs.rs/billing"
version = "0.16"
# Used for the Open Graph / Twitter card image and the JSON-LD logo.
og_image = "/og.png"

[link_checker]
# External links are checked (a dead citation fails the build). This repo's own
# files are skipped: GitHub answers runner requests to them with 429/503.
# GitHub renders heading anchors client-side, so its anchors cannot be checked.
skip_prefixes = ["https://github.com/hupe1980/billing/"]
skip_anchor_prefixes = ["https://github.com/"]
