# Zola configuration for the `billing` landing page and documentation site.
#
# Deployed to GitHub Pages by .github/workflows/site.yml. `base_url` must match the
# deployment origin exactly: it is what canonical links, Open Graph URLs and
# sitemap.xml are built from, and a wrong value makes every one of them point at a
# page that does not exist — the single most common way a static docs site loses
# its search ranking.
base_url = "https://hupe1980.github.io/billing"

title = "billing — a pure Rust tariff and invoice calculation engine"
description = """\
Domain-agnostic billing engine for Rust: fixed-point money, tiered and time-of-use \
pricing, composable VAT layers, and invoice totals that satisfy EN 16931.\
"""
author = "hupe1980"

# `default_language` sets <html lang>, which screen readers and search engines both
# read. Left as English because every word of the content is.
default_language = "en"

compile_sass = true
minify_html = true
build_search_index = true
generate_feeds = false

# Trailing-slash-free URLs would need server rewrites GitHub Pages does not do.
hard_link_static = false

[markdown]
render_emoji = false
smart_punctuation = true
insert_anchor_links = "left"

# Emit highlighting as CSS classes rather than inline hex colours, so one rendering
# of the HTML can serve both palettes. Zola generates the two stylesheets from the
# light/dark theme pair; the shell switches between them without a reflow.
[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[search]
index_format = "elasticlunr_json"

[extra]
repo = "https://github.com/hupe1980/billing"
crate = "https://crates.io/crates/billing"
api_docs = "https://docs.rs/billing"
version = "0.12"
# Used for the Open Graph / Twitter card image and the JSON-LD logo.
og_image = "/og.png"

[link_checker]
# `zola check` follows external links too, which is what catches a dead citation.
# GitHub renders heading anchors client-side, so an anchor check against a GitHub
# URL reports a false negative — skip those, not the URLs themselves.
skip_anchor_prefixes = ["https://github.com/"]
