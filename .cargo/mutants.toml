# cargo-mutants configuration — https://mutants.rs/
# Run with `just mutants`. Schema: `cargo mutants --emit-schema=config`.

# `serde` gates the deserialise-time revalidation; mutate and test it too.
all_features = true

# Mutants produce dead code and unused bindings; don't score them "unviable" for
# warnings. The crate's own `-D warnings` gates run in CI.
cap_lints = true

# The baseline suite runs in ~1 s, so the auto timeout would hit the 20 s floor; a
# higher floor keeps slow (not hung) mutants from timing out on a loaded runner.
minimum_test_timeout = 30

# `with_capacity` argument mutants only change reallocation counts; no test can catch them.
skip_calls_defaults = true

# ── Speed ─────────────────────────────────────────────────────────────────────

# No debuginfo, no incremental state — see `[profile.mutants]` in Cargo.toml.
profile = "mutants"

# Doctests are excluded from mutation runs only: they are the slowest third of
# `cargo test` and exercise happy paths the unit suites already cover. A function
# covered only by a doctest needs a real test. `just test` and CI run every doctest.
additional_cargo_test_args = ["--lib", "--tests"]

# Parallelism is per machine, not per project: `just mutants*` derives it from the
# core count; CI sets CARGO_MUTANTS_JOBS.

# ── Known survivors ───────────────────────────────────────────────────────────

# No `exclude_re`: an exclusion is a permanent blind spot. Tolerated survivors and
# their reasons live in `.cargo/mutants-baseline.txt`; `just mutants-gate` fails on
# a new survivor and on a recorded one that is now caught.
