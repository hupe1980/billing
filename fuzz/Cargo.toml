# Fuzz targets for `billing` (cargo-fuzz, nightly): `just fuzz-build`, `just fuzz parse 120`.
# Its own unpublished workspace: not built by the root `cargo build`/`cargo test`.
[package]
name = "billing-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
billing = { path = "..", features = ["serde"] }
libfuzzer-sys = "0.4"
rust_decimal = { version = "1.43", default-features = false }
serde = "1"
serde_json = "1"

# Keep this package out of any workspace above it.
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "split"
path = "fuzz_targets/split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde"
path = "fuzz_targets/serde.rs"
test = false
doc = false
bench = false
