name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml against the tagged commit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

# The checks that need a tool or a toolchain run their `just` recipe; the plain cargo
# jobs (fmt, clippy, docs, test, bench, deny) run the same cargo commands as `just ci`.
jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  # One test run per cell: the suite with all features, then the doctests, which
  # `--all-targets` silently excludes (rust-lang/cargo#6669) and which include the
  # whole README. `default = []`, so a separate no-default-features run would repeat
  # the same suite; the no-features *build* is covered by `nostd`.
  test:
    name: Test (${{ matrix.os }} · ${{ matrix.rust }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable }
          - { os: ubuntu-latest, rust: beta }
          - { os: macos-latest, rust: stable }
          - { os: windows-latest, rust: stable }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - run: cargo test --all-targets --all-features
      - run: cargo test --doc --all-features

  msrv:
    name: MSRV 1.85 (incl. doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just test-msrv

  # Constitution I: a crate that builds for a bare-metal target cannot do I/O.
  nostd:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just nostd

  # Constitution I: exactly rust_decimal (+ optional serde) at runtime.
  deps-check:
    name: Runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-check

  # Every direct dependency (library and dev) at its declared floor, resolved on
  # nightly, built and tested (doctests included, --locked) on 1.85. Guards the
  # rust_decimal floor against the PR #804 subtraction defect in 1.30–1.42.
  minimal-versions:
    name: Minimal versions (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@1.85
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just minimal-versions

  # The one advisory checker (plus licenses, bans, sources).
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  # Blocking. 0.15 → 0.16 is a breaking bump for a 0.x crate, so the intended break
  # passes as declared; from 0.16.1 on, an unintended break fails here.
  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # Compile only: timings on shared runners are noise.
  bench:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --all-features --no-run

  # Compile every fuzz target (nightly). Timed runs are local: `just fuzz <target> <seconds>`.
  fuzz-build:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz,just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: just fuzz-build

  # Rule ids cited anywhere exist in the pinned artefacts, and each cited rule's
  # (context, test, flag) still hashes to its entry in citations.lock.
  citations:
    name: Rule citations (test-hash lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check-citations

  # The full sweep is local (`just mutants-gate`). A pull request mutates only the
  # lines it changed and fails on any survivor the baseline does not record.
  mutants-diff:
    name: Mutation testing (changed lines)
    if: github.event_name == 'pull_request'
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,just
      - name: Mutate the lines this pull request changed
        run: |
          mkdir -p target
          git diff "${{ github.event.pull_request.base.sha }}...HEAD" > target/mutants.diff
          just mutants-diff-gate target/mutants.diff
