name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reusable — called by release.yml

# Cancel any in-progress run for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # ── Formatting ──────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Linting ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Documentation ───────────────────────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  # ── MSRV ────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (rust-version = 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features

  # ── Test matrix ─────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }} · Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]       # fail fast before expensive matrix
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          # beta only on ubuntu to keep the matrix manageable
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Test — default features
        run: cargo test --all-targets
      - name: Test — all features
        run: cargo test --lib --tests --all-features
      - name: Test — no default features
        run: cargo test --all-targets --no-default-features

  # ── Security advisory scan ──────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  # ── License / dependency policy ─────────────────────────────────────────────
  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny --all-features check

  # ── Semver ──────────────────────────────────────────────────────────────────
  # Catches API changes that are breaking for the declared version bump. It is a
  # linter, not a prover: behavioural breakage (a changed rounding rule) is
  # invisible to it and is covered by the property tests instead.
  semver:
    name: Semver compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # ── Mutation testing (incremental) ──────────────────────────────────────────
  # Coverage proves a line ran. This proves someone would notice if it were
  # wrong: cargo-mutants rewrites the code — flipping `<` to `<=`, replacing a
  # rounding result with its default, deleting a guard — and fails if the suite
  # still passes. For a billing engine that is the difference between "the VAT
  # code is exercised" and "the VAT code is checked".
  #
  # Scoped to the pull request diff so it stays a fast gate. The whole crate is
  # swept by the separate `mutants.yml` workflow.
  mutants:
    name: Mutation testing (diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [fmt, clippy]
    env:
      # cargo-mutants deliberately generates code that is dead, unused or
      # unreachable. Those warnings describe the mutant, not the crate, and the
      # clippy job above already holds the real line.
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --in-diff needs the merge base, not just the tip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # `just` so this job runs the *same* baseline check as `just mutants-gate`
          # locally. Two implementations of "is this survivor expected?" would
          # drift, and the one that drifts silently is the one in CI.
          tool: cargo-mutants,just
      - name: Diff against the base branch
        run: git diff origin/${{ github.base_ref }}.. | tee mutants.diff
      - name: Mutate the changed lines
        # Survivors already recorded in .cargo/mutants-baseline.txt do not fail
        # the build — otherwise editing any line near a known-equivalent mutant
        # would turn a no-op change red. Anything unrecorded does fail.
        run: just mutants-diff-gate mutants.diff
      - name: Archive mutants.out
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-incremental.out
          path: target/mutants-diff

  # ── Benchmarks ──────────────────────────────────────────────────────────────
  # Compile-only: benchmark timings are too noisy on shared runners to gate on,
  # but a benchmark that no longer builds is a real break.
  bench:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run
