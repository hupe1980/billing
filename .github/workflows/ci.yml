name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reusable — called by release.yml

# Cancel any in-progress run for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # ── Formatting ──────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Linting ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Documentation ───────────────────────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  # ── MSRV ────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (rust-version = 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features
      # The README's examples must compile on the declared MSRV too — they are the
      # first thing a new user runs. See the doctest note in the test matrix below.
      - run: cargo test --doc --all-features

  # ── Test matrix ─────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }} · Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]       # fail fast before expensive matrix
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          # beta only on ubuntu to keep the matrix manageable
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Test — default features
        run: cargo test --all-targets
      - name: Test — all features
        run: cargo test --lib --tests --all-features
      - name: Test — no default features
        run: cargo test --all-targets --no-default-features
      # Doctests need their own invocation: `--all-targets` silently EXCLUDES them
      # (rust-lang/cargo#6669), and so does `--lib --tests` — which is every step
      # above. Without this one nothing here runs them, while `src/lib.rs` ends with
      # `#![doc = include_str!("../README.md")]` precisely so that every Rust example
      # in the README is compiled and run, and the README promises it.
      - name: Test — doctests (includes the whole README)
        run: cargo test --doc --all-features

  # ── Security advisory scan ──────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # `just` so CI runs the *same* recipe as a developer does. The recipe
          # asserts that every advisory ignored in .cargo/audit.toml is ignored for a
          # crate that is genuinely not in the build graph — two implementations of
          # that check would drift, and the one in CI would drift silently.
          tool: cargo-audit,just
      - name: Run audit
        run: just audit

  # ── License / dependency policy ─────────────────────────────────────────────
  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cargo deny --all-features check

  # ── Semver ──────────────────────────────────────────────────────────────────
  # Catches API changes that are breaking for the declared version bump. It is a
  # linter, not a prover: behavioural breakage (a changed rounding rule) is
  # invisible to it and is covered by the property tests instead.
  semver:
    name: Semver compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # ── Benchmarks ──────────────────────────────────────────────────────────────
  # Compile-only: benchmark timings are too noisy on shared runners to gate on,
  # but a benchmark that no longer builds is a real break.
  bench:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run

  # ── Mutation testing, diff-scoped ───────────────────────────────────────────
  # The full sweep (~1 000 mutants) is deliberately not a CI gate; see the README.
  # A pull request mutates only the lines it changed — usually a few dozen mutants —
  # and fails on any survivor the baseline does not record. Same recipe as the
  # developer's pre-push `just mutants-diff`, so the two cannot drift.
  mutants-diff:
    name: Mutation testing (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,just
      - name: Mutate the lines this pull request changed
        run: |
          mkdir -p target
          git diff "${{ github.event.pull_request.base.sha }}...HEAD" > target/mutants.diff
          just mutants-diff-gate target/mutants.diff

  # ── Citations ───────────────────────────────────────────────────────────────
  # Every EN 16931 / Peppol / XRechnung rule id cited in the crate must exist in
  # the pinned validation artefacts. Fetches ~6 MB from GitHub; no toolchain needed.
  citations:
    name: Rule citations exist in the pinned artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check-citations
