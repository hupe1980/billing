name: Release

# Publishes to crates.io by Trusted Publishing (GitHub OIDC): no crates.io token is
# stored anywhere. The publish job exchanges a short-lived GitHub OIDC token for a
# crates.io token that rust-lang/crates-io-auth-action revokes when the job ends.
#
# Owner steps outside this file (in this order):
#   1. crates.io → billing → Settings → Trusted Publishing: add GitHub publisher
#      owner `hupe1980`, repository `billing`, workflow `release.yml`,
#      environment `crates-io`.
#   2. GitHub → Settings → Environments → `crates-io`: a required reviewer and a
#      deployment policy admitting only `v*` tags; a ruleset restricting who may
#      create `v*` tags.
#   3. After the first release published this way shows `trustpub_data` in
#      https://crates.io/api/v1/crates/billing/<version>: enable
#      "trusted publishing only" on crates.io, revoke the old API token there, then
#      delete the CARGO_REGISTRY_TOKEN secret (repository and environment).
# Break-glass procedure: the `release` recipe in the justfile.
#
# Never add a `pull_request_target` or `workflow_run` trigger to this workflow.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  verify-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $version"; exit 1
          fi

  # The only job that can mint a token: SHA-pinned actions, nothing but the publish.
  publish:
    name: Publish to crates.io
    needs: [ci, verify-version]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo publish --dry-run --locked
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Separate and re-runnable: it never publishes, and tolerates an existing release.
  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "billing $GITHUB_REF_NAME"
